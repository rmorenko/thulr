[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wsindex"
# The version lives in src/wsindex/__init__.py (__version__); hatchling
# extracts it at build time — single source of truth.
dynamic = ["version"]
description = "WSIndex — a learning CLI that indexes a developer workspace for semantic code and doc search."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "WSIndex contributors" }]
keywords = ["rag", "indexing", "search", "cli", "embeddings"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28,<1",
  "lancedb>=0.37.1",
  "numpy>=2.4,<3",
  # LanceDB brings it, and `store/lancedb.py` builds schemas with it
  # directly — the same reason `rich` is listed above rather than left
  # to Typer.
  "pyarrow>=21,<24",
  "platformdirs>=4,<5",
  # Typer ships it today, but the CLI imports it directly now.
  "rich>=13,<16",
  "tomli-w>=1.2,<2",
  "typer>=0.27,<1",
]

[project.scripts]
wsindex = "wsindex.cli:run"

[project.optional-dependencies]
# `torch` is declared because `rank/reranker.py` imports it by name to
# pick a device. It arrives with sentence-transformers either way; saying
# so keeps a transitive bump from breaking an import we make ourselves.
ml = ["sentence-transformers>=5.7,<6", "torch>=2.0"]
server = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
]
shell = ["prompt-toolkit>=3.0,<4"]
# `pydantic` likewise: `mcp_server.py` builds its tool schemas with it.
mcp = ["mcp>=1.2,<3", "pydantic>=2.0,<3"]
# Links in Postgres, for a workspace whose index is shared. SQLite stays
# the default and needs nothing.
postgres = ["psycopg[binary]>=3.2,<4"]
ast = [
  "tree-sitter>=0.26,<1",
  "tree-sitter-c-sharp>=0.23,<1",
  "tree-sitter-c>=0.24,<1",
  "tree-sitter-cpp>=0.23,<1",
  "tree-sitter-dockerfile>=0.2,<1",
  "tree-sitter-go>=0.25,<1",
  "tree-sitter-javascript>=0.25,<1",
  "tree-sitter-html>=0.23,<1",
  "tree-sitter-java>=0.23,<1",
  "tree-sitter-json>=0.24,<1",
  "tree-sitter-kotlin>=1.1,<2",
  "tree-sitter-php>=0.24,<1",
  "tree-sitter-python>=0.25,<1",
  "tree-sitter-ruby>=0.23,<1",
  "tree-sitter-rust>=0.24,<1",
  "tree-sitter-toml>=0.7,<1",
  "tree-sitter-typescript>=0.23,<1",
  "tree-sitter-xml>=0.7,<1",
  "tree-sitter-yaml>=0.7,<1",
  "tree-sitter-elixir>=0.3,<1",
  "tree-sitter-bash>=0.25,<1",
  "tree-sitter-scala>=0.26,<1",
  "tree-sitter-sql>=0.3,<1",
  "tree-sitter-hcl>=1.2,<2",
  "tree-sitter-swift>=0.7,<1",
  "tree-sitter-objc>=3,<4",
]

[dependency-groups]
dev = [
  "ruff>=0.16,<1",
  "mypy>=2.3,<3",
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "pre-commit>=4.6,<5",
  "mdformat>=1.0,<2",
  "mdformat-gfm>=1.0,<2",
  "codespell>=2.4,<3",
  "taplo>=0.9,<1",
  "yamlfix>=1.19,<2",
  "poethepoet>=0.38,<1",
  "complexipy>=4.0,<5",
  "deptry>=0.23,<1",
  "pip-audit>=2.9,<3",
  "pyarrow-stubs>=20.0.0.20260819",
  # Dev only, and only to check one thing: that the generated
  # `wsindex.schema.json` is a valid schema and accepts what the config
  # validator accepts. A schema that lies is worse than none — it would
  # underline a working config in somebody's editor.
  "jsonschema>=4.25,<5",
  "types-jsonschema>=4.25",
  "prometheus-client>=0.26.0",
  "einops>=0.8.2",
]

[tool.uv]
# pathspec 1.1.1 is broken: `agg.py` imports `re2_error` from `re2/base.py`,
# where the name is only annotated, never assigned (it lives in `re2/_base.py`).
# Keep it out of hatchling's isolated build env until a fixed release lands.
build-constraint-dependencies = ["pathspec!=1.1.1"]

[tool.hatch.version]
path = "src/wsindex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wsindex"]

[tool.deptry]
# The package under test is first-party; without this every internal
# import reads as a transitive dependency and the real findings drown.
known_first_party = ["wsindex"]
# The measuring harnesses import each other by putting `scripts/` on
# `sys.path`. They are programs, not a package, and their imports are not
# dependency declarations.
# Regexes, and the defaults have to be repeated: setting this replaces
# them, and dropping `\.venv` sends deptry through the whole virtualenv.
exclude = [
  "venv",
  "\\.venv",
  "\\.direnv",
  "\\.git",
  "tests",
  "scripts",
  "probes",
  "examples",
]

[tool.deptry.per_rule_ignores]
# Every grammar is loaded by name at runtime — `GrammarSpec(module=
# "tree_sitter_sql")` — so `src/` contains no `import` statement for any
# of them and never will. The whole list is here rather than a pattern,
# so that adding a language is a visible line rather than a silent
# match.
DEP002 = [
  "python-multipart",
  "tree-sitter-bash",
  "tree-sitter-c",
  "tree-sitter-c-sharp",
  "tree-sitter-cpp",
  "tree-sitter-dockerfile",
  "tree-sitter-elixir",
  "tree-sitter-go",
  "tree-sitter-hcl",
  "tree-sitter-html",
  "tree-sitter-java",
  "tree-sitter-javascript",
  "tree-sitter-json",
  "tree-sitter-kotlin",
  "tree-sitter-objc",
  "tree-sitter-php",
  "tree-sitter-python",
  "tree-sitter-ruby",
  "tree-sitter-rust",
  "tree-sitter-scala",
  "tree-sitter-sql",
  "tree-sitter-swift",
  "tree-sitter-toml",
  "tree-sitter-typescript",
  "tree-sitter-xml",
  "tree-sitter-yaml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "C4",
  "PTH",
  "RUF",
  # Added 2026-09-20, after counting what each would cost on this
  # codebase rather than guessing. `S` found fourteen things worth
  # reading, two of which were real; the rest cost nothing and keep a
  # class of mistake from arriving.
  "S",    # bandit: what a security page should have to answer for
  "A",    # builtins shadowed
  "N",    # naming
  "PERF",
  "DTZ",  # a naive datetime is a bug waiting for a second timezone
  "C90",  # cyclomatic, beside complexipy's cognitive
  "LOG",
  "G",    # logging call shapes
  "RET",
  "ERA",  # commented-out code
  # Only the "this has no docstring at all" half. The rest of pydocstyle
  # is a house style this project deliberately does not keep: 115 of its
  # findings are `D401`, non-imperative mood, and the docstrings here are
  # narrative on purpose.
  "D101",
  "D102",
  "D103",
  "D106",
  "D107",
]
ignore = [
  # `Busy` and `DocumentNotFound` read better than `BusyError` and
  # `DocumentNotFoundError`, and the second is plugin-facing: renaming it
  # for a suffix would break somebody's connector to satisfy a style.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
# A test that cannot use `assert` is not a test, and a fixture with no
# docstring is not a gap. `scripts/` holds the measuring harnesses: they
# shell out to git and ripgrep by design and are read as programs rather
# than as an API.
#
# `S105`/`S106` are worth a sentence of their own. They fire on
# `token_env = "VOYAGE_API_KEY"` — the *name* of an environment
# variable, which is the one rule this project keeps everywhere
# precisely so that no key is ever written down. The check cannot tell
# the difference, and the thing it flags is the cure.
"tests/**" = [
  # `test_filter_by_multiple_langs_is_OR` says OR because the test is
  # about OR. Lowercasing it would make the name worse to read.
  "N802",
  "S101",
  "S104",
  "S105",
  "S106",
  "S108",
  "S603",
  "S607",
  "D101",
  "D102",
  "D103",
  "D106",
  "D107",
]
# The measuring harnesses: they shell out to git and ripgrep on purpose,
# sample with `random` because nothing here is cryptographic, and import
# `relevance as R` by a convention older than this rule set.
"scripts/**" = [
  "S101",
  "S105",
  "S106",
  "S311",
  "S603",
  "S607",
  "N812",
  "C901",
  # Three loops here append under a condition that a comment explains.
  # A comprehension would be shorter and would bury the sentence.
  "PERF401",
  "D101",
  "D102",
  "D103",
  "D106",
  "D107",
]
# `probes/` are one-question experiments, gitignored and read once.
"probes/**" = [
  "S101",
  "S105",
  "S106",
  "S311",
  "S603",
  "S607",
  "N812",
  "C901",
  # Three loops here append under a condition that a comment explains.
  # A comprehension would be shorter and would bury the sentence.
  "PERF401",
  "D101",
  "D102",
  "D103",
  "D106",
  "D107",
]

[tool.ruff.lint.mccabe]
# Fifteen, to agree with `complexipy`'s gate rather than argue with it at
# ten. Two metrics, one threshold: a function that is fine by one and
# not the other is a conversation nobody needs.
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# 3.12, not 3.11: numpy >=2.4 stubs use PEP 695 `type` aliases, and mypy
# feature-gates that syntax by python_version even in stub files. Runtime
# 3.11 compatibility is still covered by the pytest jobs in the CI matrix.
python_version = "3.12"
strict = true
warn_unused_ignores = true
# `scripts/` holds the harnesses (acceptance, bench). They are not
# importable as a package, so the tests that check their judgement add
# the directory to `sys.path`; mypy needs to be told the same.
mypy_path = "scripts"

# CI installs without the ml extra (torch is huge); the import is already
# guarded at runtime, so a missing sentence_transformers is fine to skip.
[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional extra: the base install has no psycopg, and the import that
# needs it is behind a try/except that says so.
module = "psycopg.*"
ignore_missing_imports = true

[tool.codespell]
# `*_report.md` is a run artifact, already gitignored, and it quotes the
# harvested questions back — so it carries their spelling too. Protocols
# are the same: they quote real symbol names out of real repositories,
# and a misspelling in somebody else's symbol name is evidence rather
# than prose this project wrote.
# `harvested` holds issue titles copied verbatim from real trackers, and
# people writing bug reports misspell things. Correcting them would be
# editing the measurement to look tidier — those questions are evidence,
# not prose this project wrote. A glob, because codespell matches these
# against whole paths rather than directory names.
skip = ".git,.venv,uv.lock,.mypy_cache,.ruff_cache,.pytest_cache,.claude,htmlcov,build,dist,probes,*/harvested/*,*_report.md,*/protocols/*,tier1-*.md,tier2-*.md"
# `thirdparty` is a directory name repositories really use, listed in
# `domains.NOT_THE_SUBJECT` beside `third_party` for that reason.
ignore-words-list = "thirdparty"

[tool.yamlfix]
line_length = 100
# Keep diffs minimal: no forced `---` document start, no flow/block rewriting,
# blank separator lines allowed.
explicit_start = false
sequence_style = "keep_style"
whitelines = 1

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs network and a real model download"]
addopts = "-m 'not slow'"

[tool.coverage.run]
source = ["wsindex"]

[tool.coverage.report]
fail_under = 90
show_missing = true

# Task runner (replaces the retired Makefile). Run `uv run poe <task>` or
# `uv run poe --help` to see the list. Bare tool names work because `uv run`
# puts the project venv on PATH before launching poe.
[tool.poe.tasks.install]
help = "Install dependencies (uv sync)"
cmd = "uv sync"

[tool.poe.tasks.schema]
help = "Regenerate wsindex.schema.json from the config validator"
cmd = "python -c \"import json;from pathlib import Path;from wsindex.config.jsonschema import build,SCHEMA_FILE;Path(SCHEMA_FILE).write_text(json.dumps(build(),indent=2)+chr(10))\""

[tool.poe.tasks.lint]
help = "Run linter (ruff check)"
cmd = "ruff check ."

[tool.poe.tasks.deps]
help = "Dependency hygiene: unused, undeclared, transitive"
cmd = "deptry ."

[tool.poe.tasks.audit]
help = "Known vulnerabilities in the installed dependencies"
cmd = "pip-audit --progress-spinner off"

[tool.poe.tasks.complexity]
help = "Cognitive complexity: fail any function over the default 15"
cmd = "complexipy src/wsindex"

[tool.poe.tasks.spell]
help = "Spell check (codespell)"
cmd = "codespell"

[tool.poe.tasks.typecheck]
help = "Type check (mypy)"
cmd = "mypy src tests"

[tool.poe.tasks.test]
help = "Run tests (pytest, no coverage)"
cmd = "pytest"

[tool.poe.tasks.cov]
help = "Run tests with coverage, fail under 90%"
cmd = "pytest --cov --cov-report=term-missing"

[tool.poe.tasks.run]
help = "Run the wsindex CLI"
cmd = "wsindex"

[tool.poe.tasks.example-plugin]
help = "Install both example plugins (language, connector) and run their tests"
interpreter = "bash"
shell = """
set -eu -o pipefail
uv pip install -q -e examples/wsindex-lang-lua -e examples/wsindex-connector-notion
pytest examples/wsindex-lang-lua/tests examples/wsindex-connector-notion/tests
"""

[tool.poe.tasks.bench]
help = "Performance benchmarks on the acceptance corpus (--save/--baseline to compare runs)"
cmd = "python scripts/bench.py"

[tool.poe.tasks.load]
help = "Load the HTTP server and judge it against the SLO fixed in scripts/load.py"
cmd = "python scripts/load.py"

[tool.poe.tasks.acceptance]
help = "Smoke test: ten criteria on one repo, both backends, writes acceptance_report.md"
cmd = "python scripts/acceptance.py"

[tool.poe.tasks.relevance]
help = "Does it find the right file? Blind questions, pinned corpus, ripgrep control"
cmd = "python scripts/relevance.py"

[tool.poe.tasks.hooks]
help = "Run pre-commit on all files"
cmd = "pre-commit run --all-files"

[tool.poe.tasks.install-hooks]
help = "Install the git pre-commit hook"
cmd = "pre-commit install"

[tool.poe.tasks.up]
help = "Start compose services (docker compose up -d)"
cmd = "docker compose up -d"

[tool.poe.tasks.down]
help = "Stop compose services (docker compose down)"
cmd = "docker compose down"

[tool.poe.tasks.logs]
help = "Tail compose logs (docker compose logs -f)"
cmd = "docker compose logs -f"

# `git ls-files` (not a bare glob) so generated files like uv.lock and anything
# under .venv never reach the formatters.
[tool.poe.tasks.fmt]
help = "Format code, docs and configs (ruff w/ safe fixes, mdformat, taplo, yamlfix, json.tool, xmllint)"
interpreter = "bash"
shell = """
set -eu -o pipefail
ruff check --fix .
ruff format .
git ls-files '*.md' | grep -v '^docs/protocols/' | xargs -r mdformat
git ls-files '*.toml' | xargs -r taplo fmt
git ls-files '*.yml' '*.yaml' | xargs -r yamlfix
for f in $(git ls-files '*.json'); do
  python -m json.tool --indent 2 "$f" "$f.tmp" && mv "$f.tmp" "$f"
done
for f in $(git ls-files '*.xml' '*.xsd'); do
  xmllint --format "$f" --output "$f"
done
"""

[tool.poe.tasks.fmt-check]
help = "Check formatting without changing files"
interpreter = "bash"
shell = """
set -eu -o pipefail
ruff format --check .
git ls-files '*.md' | grep -v '^docs/protocols/' | xargs -r mdformat --check
git ls-files '*.toml' | xargs -r taplo fmt --check
git ls-files '*.yml' '*.yaml' | xargs -r yamlfix --check
for f in $(git ls-files '*.json'); do
  python -m json.tool --indent 2 "$f" | diff -u "$f" -
done
for f in $(git ls-files '*.xml' '*.xsd'); do
  xmllint --format "$f" | diff -u "$f" -
done
"""

[tool.poe.tasks.check]
help = "Auto-format, then lint + spelling + types + tests w/ coverage"
sequence = ["fmt", "lint", "spell", "typecheck", "cov"]

[tool.poe.tasks.clean]
help = "Remove caches, build artifacts and index"
interpreter = "bash"
shell = """
rm -rf .mypy_cache .ruff_cache .pytest_cache .wsindex build dist
rm -rf htmlcov .coverage coverage.xml
find . -type d -name __pycache__ -exec rm -rf {} +
find . -type d -name '*.egg-info' -exec rm -rf {} +
"""
