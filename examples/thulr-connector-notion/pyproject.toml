[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thulr-connector-notion"
version = "0.1.0"
description = "Notion support for thulr, as a worked example of a connector plugin."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Thulr contributors" }]
keywords = ["thulr", "plugin", "connector", "notion"]

# Nothing but the standard library. A connector needs an HTTP client and
# a JSON parser, and Python ships both — the transport inside thulr is
# private on purpose, so a plugin owns its own.
#
# A plugin published to PyPI would also declare `thulr>=0.1` here. This
# one does not, so that `uv pip install -e examples/thulr-connector-notion`
# works inside the thulr repo without resolving thulr from an index
# it is not published to.
dependencies = []

# The whole integration surface. hatchling copies this into
# thulr_connector_notion-0.1.0.dist-info/entry_points.txt at install
# time, and thulr reads it back with importlib.metadata — see
# thulr.connectors.plugins. The name on the left is the `type` a
# [[connectors]] entry asks for.
[project.entry-points."thulr.connectors"]
notion = "thulr_connector_notion:NotionConnector"

[tool.hatch.build.targets.wheel]
packages = ["src/thulr_connector_notion"]

[tool.ruff]
line-length = 100
target-version = "py311"
